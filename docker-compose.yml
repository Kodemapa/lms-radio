# Local development services. Requires Docker (or OrbStack / Colima on macOS).
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: elms
      POSTGRES_PASSWORD: elms
      POSTGRES_DB: elms
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']

  # S3-compatible storage for local dev (production: AWS S3 ap-south-1 — data stays in India).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elms
      MINIO_ROOT_PASSWORD: elms-dev-password
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
