# Local development services. Requires Docker (or OrbStack / Colima on macOS).
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: elms
      POSTGRES_PASSWORD: elms
      POSTGRES_DB: elms
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']

  # S3-compatible storage for local dev (production: AWS S3 ap-south-1 — data stays in India).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elms
      MINIO_ROOT_PASSWORD: elms-dev-password
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  # Trace viewer for local development (open source). UI: http://localhost:16686
  # API sends spans here when OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['16686:16686', '4318:4318']

volumes:
  pgdata:
  miniodata:
