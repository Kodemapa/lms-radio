packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - electron
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# One copy of dcmjs in the browser: Cornerstone pins 0.52.0, we use 0.52.2 (saves ~700 kB).
overrides:
  dcmjs: 0.52.2
