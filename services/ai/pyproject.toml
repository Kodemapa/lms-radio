[project]
name = "obgyn-elms-ai"
version = "0.1.0"
description = "AI service: ultrasound plane classification, biometry landmarking, LLM tutor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
# Install when models are added: torch, monai

[tool.pytest.ini_options]
testpaths = ["tests"]
